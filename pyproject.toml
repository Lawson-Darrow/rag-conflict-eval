[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-conflict-eval"
version = "0.2.0"
description = "Conflict-type-conditioned behavior-adherence evaluation for RAG, built on the CONFLICTS dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lawson Darrow" }]
keywords = ["rag", "evaluation", "llm", "knowledge-conflict", "retrieval-augmented-generation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.40",   # model-agnostic judge calls
]

[project.optional-dependencies]
deepeval = ["deepeval>=1.0"]
# ragas 0.4.x currently breaks on langchain 1.x (vertexai import); 0.2.x verified working.
ragas = ["ragas>=0.2,<0.3"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
rag-conflict-eval = "rag_conflict_eval.cli:main"

[project.urls]
Homepage = "https://github.com/Lawson-Darrow/rag-conflict-eval"
Issues = "https://github.com/Lawson-Darrow/rag-conflict-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_conflict_eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
